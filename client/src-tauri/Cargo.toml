[package]
name = "ror-desktop"
version = "0.1.0"
description = "Ror Desktop"
edition = "2021"

[lib]
name = "ror_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4.2.0"
notify-debouncer-mini = "0.7.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7.2"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "sync"] }
tokio-util = "0.7.20"
trash = "5.2.9"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
keyring-core = "1.0.1"
tokio = { version = "1.54.1", features = ["rt"] }
